[package]
name = "compukter-playground"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "compukter-playground"
path = "src/main.rs"
test = false
bench = false

[dependencies]
compukter-vm = { path = "../Compukter-VM" }
compukter-vm-devices = { path = "../Compukter-VM/crates/compukter-vm-devices" }
eframe = "0.35"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"
vt100 = "0.16.2"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
